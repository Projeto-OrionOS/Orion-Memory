name: Orion Memory | Build Windows x64

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "NativeHost/**"
      - "Assets/**"
      - "Languages/**"
      - "Languages.json"
      - "app.manifest"
      - "Tests/Native/**"
      - "scripts/Build-Native.ps1"
      - "Compilar.bat"
      - ".github/workflows/build-windows.yml"
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Compilar e testar (Windows x64)
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - name: Obter codigo-fonte
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verificar estrutura e testes estaticos
        shell: pwsh
        run: |
          $required = @(
            "NativeHost/host.c",
            "NativeHost/host.rc",
            "scripts/Build-Native.ps1",
            "Compilar.bat",
            "Languages.json",
            "Tests/Native/revisao_qualidade.py"
          )
          foreach ($path in $required) {
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Arquivo obrigatorio ausente: $path"
            }
          }
          python Tests/Native/revisao_qualidade.py
          if ($LASTEXITCODE -ne 0) { throw "Verificacao estatica falhou." }

      - name: Preparar Zig 0.15.2
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.15.2

      - name: Verificar Zig instalado
        shell: pwsh
        run: |
          $detected = (zig version).Trim()
          if ($detected -ne "0.15.2") { throw "Versao Zig incorreta: $detected" }

      - name: Compilar com Zig 0.15.2 e executar autotestes
        shell: pwsh
        run: .\scripts\Build-Native.ps1 -NoDownload -Runtime win-x64

      - name: Conferir resultado
        shell: pwsh
        run: |
          if (-not (Test-Path -LiteralPath "dist/win-x64/OrionMemory.exe")) { throw "EXE nao encontrado." }
          if (-not (Test-Path -LiteralPath "dist/OrionMemory_v1.0.0_win-x64.zip")) { throw "ZIP nao encontrado." }

      - name: Disponibilizar ZIP portatil
        uses: actions/upload-artifact@v4
        with:
          name: OrionMemory-v1.0.0-win-x64
          path: dist/OrionMemory_v1.0.0_win-x64.zip
          if-no-files-found: error
          retention-days: 30
