name: Orion Memory - Windows nativo
on:
  workflow_dispatch:
  push:
    paths:
      - 'NativeHost/**'
      - 'Assets/**'
      - 'Languages/**'
      - 'Languages.json'
      - 'scripts/Build-Native.ps1'
      - '.github/workflows/build-windows.yml'
permissions:
  contents: read
jobs:
  win-x64:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Validar fontes, icone e 44 idiomas
        shell: pwsh
        run: |
          python Tests/Native/revisao_qualidade.py
          python Tests/Native/verify_locales.py
      - name: Preparar Zig 0.15.2
        uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2
      - name: Compilar e testar com Zig oficial
        shell: pwsh
        run: |
          $zig = (Get-Command zig -ErrorAction Stop).Source
          & $zig version
          ./scripts/Build-Native.ps1 -NoDownload -ZigPath $zig -Runtime win-x64
      - name: Publicar arquivo .zip pronto para usar
        uses: actions/upload-artifact@v4
        with:
          name: OrionMemory-v1.0.0-win-x64
          path: dist/OrionMemory_v1.0.0_win-x64.zip
          if-no-files-found: error

  codigo-fonte:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Empacotar codigo-fonte rastreado
        shell: bash
        run: |
          git archive --format=zip --output=OrionMemory_v1.0.0_CODIGO_FONTE.zip HEAD
      - name: Disponibilizar ZIP do codigo-fonte
        uses: actions/upload-artifact@v4
        with:
          name: OrionMemory-v1.0.0-codigo-fonte
          path: OrionMemory_v1.0.0_CODIGO_FONTE.zip
          if-no-files-found: error
